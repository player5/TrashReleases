<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEKA WEB</title><link rel="icon" type="image/png" href="/static/seka-logo.png?v=1254"><link rel="apple-touch-icon" href="/static/seka-logo.png?v=1254"><style>
:root{font-family:system-ui,Arial,sans-serif;color:#183c31;background:#edf3ef}*{box-sizing:border-box}body{margin:0}header .brand{display:flex;align-items:center;gap:12px}header .brand img{width:42px;height:42px;object-fit:contain;flex:none}header{background:#174b3b;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}h2{font-size:19px}main{max-width:1200px;margin:24px auto;padding:0 16px}.panel{background:white;border-radius:12px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #143a2911}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{border:0;border-radius:8px;padding:10px 14px;background:#287458;color:white;cursor:pointer}button.secondary{background:#dcebe2;color:#174b3b}button:disabled{opacity:.5}input{padding:11px;border:1px solid #b9cfc2;border-radius:8px;max-width:100%;margin:4px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e2ebe6;padding:9px}th{color:#537668}small{color:#5b756a}#notice{color:#9d352d;min-height:1.5em}#auth{max-width:450px;margin:8vh auto}.hide{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#287458}
label{display:block;margin:12px 0}label input{display:block;width:100%;margin:5px 0}.password-wrap{position:relative;display:inline-flex;align-items:center;max-width:100%;vertical-align:middle}.password-wrap input{padding-right:46px}.password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:transparent;color:#174b3b;border:0;padding:6px;display:grid;place-items:center}.password-toggle:hover{background:#dcebe2}.password-toggle svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style></head><body><header><div class="brand"><img src="/static/seka-logo.png?v=1254" alt="SEKA"><h1>SEKA WEB <small style="color:#d6eee1">development</small></h1></div><button id="exit" class="secondary hide">Выйти</button></header><main><p id="notice" role="alert"></p><section id="first-run" class="panel hide" style="max-width:480px;margin:8vh auto"><h2>Первоначальная настройка SEKA WEB</h2><p>Создайте учётную запись администратора. Это потребуется только один раз.</p><form id="setup-form"><label>Логин администратора<input name="username" autocomplete="username" minlength="3" maxlength="40" required></label><label>Пароль<input name="password" type="password" autocomplete="new-password" minlength="1" required></label><label>Повторите пароль<input name="password_confirm" type="password" autocomplete="new-password" minlength="1" required></label><button type="submit">Создать администратора</button></form><p><small>Тестовая локальная версия. Создавайте администратора только в доверенной сети.</small></p></section><section id="auth" class="panel hide"><h2>Вход</h2><form id="login"><input name="username" placeholder="Логин" required autocomplete="username"><input name="password" type="password" placeholder="Пароль" required autocomplete="current-password"><button>Войти</button></form></section><section id="workspace" class="hide"><div id="identity"></div><nav class="nav" id="tabs"></nav><section id="view" class="panel"></section><p><small>Система в разработке. Рабочая база PostgreSQL и запуск заданий пока не подключены.</small></p></section></main><script>
(()=>{'use strict';let token='',roles=[];const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const notice=s=>$('notice').textContent=s||'';
async function api(path,opts={}){const headers={'Authorization':'Bearer '+token,...(opts.body&&!(opts.body instanceof FormData)?{'Content-Type':'application/json'}:{}),...(opts.headers||{})};let response=await fetch('/api'+path,{...opts,headers,cache:'no-store'});if(!response.ok){let error=await response.json().catch(()=>({detail:'Ошибка запроса'}));throw Error(typeof error.detail==='string'?error.detail:'HTTP '+response.status)}return response.json()}
async function checkSetup(){try{const r=await fetch('/api/setup/status',{cache:'no-store'});if(!r.ok)throw Error('Не удалось проверить настройку');const data=await r.json();$('first-run').classList.toggle('hide',!data.needs_setup);$('auth').classList.toggle('hide',data.needs_setup)}catch(e){notice(e.message)}}
$('setup-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b=e.target.querySelector('button');if(f.get('password')!==f.get('password_confirm')){notice('Пароли не совпадают');return}b.disabled=true;try{const r=await fetch('/api/setup/initialize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password'),password_confirm:f.get('password_confirm')})});if(!r.ok){const x=await r.json();throw Error(x.detail||'Не удалось создать администратора')}const login=$('login');login.elements.username.value=f.get('username');login.elements.password.value=f.get('password');$('first-run').classList.add('hide');$('auth').classList.remove('hide');notice('Администратор создан. Выполните вход.');login.requestSubmit()}catch(err){notice(err.message);await checkSetup()}finally{b.disabled=false}};
checkSetup();
const eyeOpen='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';const eyeClosed='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A11.6 11.6 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.4 3.7M6.2 6.9C3.5 8.7 2 12 2 12s3.6 6 10 6a10.9 10.9 0 0 0 4.4-.9"/><path d="M10 10a3 3 0 0 0 4 4"/></svg>';
function addPasswordToggles(root=document){for(const input of root.querySelectorAll('input[type="password"]')){if(input.parentElement.classList.contains('password-wrap'))continue;const wrap=document.createElement('span');wrap.className='password-wrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);const btn=document.createElement('button');btn.type='button';btn.className='password-toggle';btn.setAttribute('aria-label','Показать пароль');btn.setAttribute('aria-pressed','false');btn.innerHTML=eyeOpen;btn.addEventListener('click',()=>{const showing=input.type==='password';input.type=showing?'text':'password';btn.setAttribute('aria-label',showing?'Скрыть пароль':'Показать пароль');btn.setAttribute('aria-pressed',String(showing));btn.innerHTML=showing?eyeClosed:eyeOpen;input.focus()});wrap.appendChild(btn)}}
addPasswordToggles();
const tabs=[['modules','Модули'],['jobs','Задания'],['files','Файлы'],['notifications','Уведомления'],['users','Сотрудники'],['audit','Аудит']];
function table(rows,columns){if(!rows.length)return '<p>Пока нет записей.</p>';return '<div style="overflow-x:auto"><table><thead><tr>'+columns.map(x=>'<th>'+escape(x[1])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+columns.map(x=>'<td>'+escape(r[x[0]] instanceof Array?r[x[0]].join(', '):r[x[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
async function view(section){notice('');const v=$('view');v.textContent='Загрузка…';try{if(section==='modules'){const rows=await api('/modules');v.innerHTML='<h2>Модули</h2>'+table(rows,[['name','Название'],['id','ID'],['version','Версия'],['enabled','Включён']]);if(roles.includes('admin')){for(const m of rows){const b=document.createElement('button');b.className='secondary';b.textContent=(m.enabled?'Отключить ':'Включить ')+m.name;b.onclick=async()=>{try{await api('/modules/'+encodeURIComponent(m.id)+'/'+(m.enabled?'disable':'enable'),{method:'POST'});view('modules')}catch(e){notice(e.message)}};v.appendChild(b)}}}
else if(section==='jobs'){v.innerHTML='<h2>Задания</h2>'+table(await api('/jobs'),[['id','ID'],['module_id','Модуль'],['kind','Тип'],['status','Статус'],['progress','Прогресс'],['owner','Создал']])}
else if(section==='files'){v.innerHTML='<h2>Файлы</h2>'+table(await api('/files'),[['name','Имя'],['size','Байт'],['module_id','Модуль'],['owner','Владелец'],['id','ID']])+'<p><small>Загрузка файлов доступна через API модулей.</small></p>'}
else if(section==='notifications'){const rows=await api('/notifications');v.innerHTML='<h2>Уведомления</h2>'+table(rows,[['message','Сообщение'],['actor','Отправитель'],['created','Время UNIX'],['read_at','Прочитано']]);for(const n of rows.filter(x=>!x.read_at)){const b=document.createElement('button');b.textContent='Прочитано: '+n.message.slice(0,50);b.onclick=async()=>{await api('/notifications/'+encodeURIComponent(n.id)+'/read',{method:'POST'});view('notifications')};v.appendChild(b)}}
else if(section==='users'){v.innerHTML='<h2>Сотрудники</h2>'+table(await api('/users'),[['username','Логин'],['roles','Роли'],['active','Активен']])+'<h3>Добавить сотрудника</h3><form id="adduser"><input name="username" placeholder="Логин" required><input name="password" type="password" placeholder="Пароль (от 1 символа)" minlength="1" required><button>Создать</button></form>';$('adduser').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/users',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password'),roles:['staff']})});view('users')}catch(err){notice(err.message)}}}
else if(section==='audit'){v.innerHTML='<h2>Аудит</h2>'+table(await api('/audit'),[['actor','Пользователь'],['action','Действие'],['subject','Объект'],['created','Время UNIX']])}}
catch(e){v.textContent='Не удалось загрузить раздел.';notice(e.message)}}
$('login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})});if(!response.ok)throw Error('Неверный логин или пароль');token=(await response.json()).access_token;const me=await api('/me');roles=me.roles;$('identity').textContent='Пользователь: '+me.username+' · Роли: '+roles.join(', ');$('auth').classList.add('hide');$('workspace').classList.remove('hide');$('exit').classList.remove('hide');$('tabs').replaceChildren();for(const [id,label] of tabs){if(['users','audit'].includes(id)&&!roles.includes('admin'))continue;const b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=()=>view(id);$('tabs').appendChild(b)}view('modules')}catch(err){notice(err.message)}};
$('exit').onclick=async()=>{try{await api('/logout',{method:'POST'})}catch(e){}token='';roles=[];$('auth').classList.remove('hide');$('workspace').classList.add('hide');$('exit').classList.add('hide');notice('')};})();
</script></body></html>
