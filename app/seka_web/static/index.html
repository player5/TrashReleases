<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEKA WEB</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#183c31;background:#edf3ef}*{box-sizing:border-box}body{margin:0}header{background:#174b3b;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}h2{font-size:19px}main{max-width:1200px;margin:24px auto;padding:0 16px}.panel{background:white;border-radius:12px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #143a2911}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{border:0;border-radius:8px;padding:10px 14px;background:#287458;color:white;cursor:pointer}button.secondary{background:#dcebe2;color:#174b3b}button:disabled{opacity:.5}input{padding:11px;border:1px solid #b9cfc2;border-radius:8px;max-width:100%;margin:4px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e2ebe6;padding:9px}th{color:#537668}small{color:#5b756a}#notice{color:#9d352d;min-height:1.5em}#auth{max-width:450px;margin:8vh auto}.hide{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#287458}
</style></head><body><header><h1>SEKA WEB <small style="color:#d6eee1">development</small></h1><button id="exit" class="secondary hide">Выйти</button></header><main><p id="notice" role="alert"></p><section id="auth" class="panel"><h2>Вход</h2><form id="login"><input name="username" placeholder="Логин" required autocomplete="username"><input name="password" type="password" placeholder="Пароль" required autocomplete="current-password"><button>Войти</button></form><p><small>Первичная настройка администратора выполняется через локальный API /api/bootstrap.</small></p></section><section id="workspace" class="hide"><div id="identity"></div><nav class="nav" id="tabs"></nav><section id="view" class="panel"></section><p><small>Система в разработке. Рабочая база PostgreSQL и запуск заданий пока не подключены.</small></p></section></main><script>
(()=>{'use strict';let token='',roles=[];const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const notice=s=>$('notice').textContent=s||'';
async function api(path,opts={}){const headers={'Authorization':'Bearer '+token,...(opts.body&&!(opts.body instanceof FormData)?{'Content-Type':'application/json'}:{}),...(opts.headers||{})};let response=await fetch('/api'+path,{...opts,headers,cache:'no-store'});if(!response.ok){let error=await response.json().catch(()=>({detail:'Ошибка запроса'}));throw Error(typeof error.detail==='string'?error.detail:'HTTP '+response.status)}return response.json()}
const tabs=[['modules','Модули'],['jobs','Задания'],['files','Файлы'],['notifications','Уведомления'],['users','Сотрудники'],['audit','Аудит']];
function table(rows,columns){if(!rows.length)return '<p>Пока нет записей.</p>';return '<div style="overflow-x:auto"><table><thead><tr>'+columns.map(x=>'<th>'+escape(x[1])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+columns.map(x=>'<td>'+escape(r[x[0]] instanceof Array?r[x[0]].join(', '):r[x[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
async function view(section){notice('');const v=$('view');v.textContent='Загрузка…';try{if(section==='modules'){const rows=await api('/modules');v.innerHTML='<h2>Модули</h2>'+table(rows,[['name','Название'],['id','ID'],['version','Версия'],['enabled','Включён']]);if(roles.includes('admin')){for(const m of rows){const b=document.createElement('button');b.className='secondary';b.textContent=(m.enabled?'Отключить ':'Включить ')+m.name;b.onclick=async()=>{try{await api('/modules/'+encodeURIComponent(m.id)+'/'+(m.enabled?'disable':'enable'),{method:'POST'});view('modules')}catch(e){notice(e.message)}};v.appendChild(b)}}}
else if(section==='jobs'){v.innerHTML='<h2>Задания</h2>'+table(await api('/jobs'),[['id','ID'],['module_id','Модуль'],['kind','Тип'],['status','Статус'],['progress','Прогресс'],['owner','Создал']])}
else if(section==='files'){v.innerHTML='<h2>Файлы</h2>'+table(await api('/files'),[['name','Имя'],['size','Байт'],['module_id','Модуль'],['owner','Владелец'],['id','ID']])+'<p><small>Загрузка файлов доступна через API модулей.</small></p>'}
else if(section==='notifications'){const rows=await api('/notifications');v.innerHTML='<h2>Уведомления</h2>'+table(rows,[['message','Сообщение'],['actor','Отправитель'],['created','Время UNIX'],['read_at','Прочитано']]);for(const n of rows.filter(x=>!x.read_at)){const b=document.createElement('button');b.textContent='Прочитано: '+n.message.slice(0,50);b.onclick=async()=>{await api('/notifications/'+encodeURIComponent(n.id)+'/read',{method:'POST'});view('notifications')};v.appendChild(b)}}
else if(section==='users'){v.innerHTML='<h2>Сотрудники</h2>'+table(await api('/users'),[['username','Логин'],['roles','Роли'],['active','Активен']])+'<h3>Добавить сотрудника</h3><form id="adduser"><input name="username" placeholder="Логин" required><input name="password" type="password" placeholder="Пароль (от 12 символов)" minlength="12" required><button>Создать</button></form>';$('adduser').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/users',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password'),roles:['staff']})});view('users')}catch(err){notice(err.message)}}}
else if(section==='audit'){v.innerHTML='<h2>Аудит</h2>'+table(await api('/audit'),[['actor','Пользователь'],['action','Действие'],['subject','Объект'],['created','Время UNIX']])}}
catch(e){v.textContent='Не удалось загрузить раздел.';notice(e.message)}}
$('login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})});if(!response.ok)throw Error('Неверный логин или пароль');token=(await response.json()).access_token;const me=await api('/me');roles=me.roles;$('identity').textContent='Пользователь: '+me.username+' · Роли: '+roles.join(', ');$('auth').classList.add('hide');$('workspace').classList.remove('hide');$('exit').classList.remove('hide');$('tabs').replaceChildren();for(const [id,label] of tabs){if(['users','audit'].includes(id)&&!roles.includes('admin'))continue;const b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=()=>view(id);$('tabs').appendChild(b)}view('modules')}catch(err){notice(err.message)}};
$('exit').onclick=async()=>{try{await api('/logout',{method:'POST'})}catch(e){}token='';roles=[];$('auth').classList.remove('hide');$('workspace').classList.add('hide');$('exit').classList.add('hide');notice('')};})();
</script></body></html>
